# ============================================================
#  FixMate — configuration for running inside Docker.
#  Non-secret settings are fixed here; every secret comes from an
#  environment variable (set by docker-compose). No secrets in the repo.
#  Activated by SPRING_PROFILES_ACTIVE=docker.
# ============================================================

# --- Database (host/credentials come from the environment) ---
spring.datasource.url=jdbc:mysql://${DB_HOST:db}:${DB_PORT:3306}/${DB_NAME:fixmate_db}?useSSL=false&serverTimezone=Asia/Jerusalem&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- JWT ---
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

server.port=8080

# --- OpenAI (optional; empty = AI feature limited) ---
openai.api.key=${OPENAI_API_KEY:}
openai.api.model=${OPENAI_API_MODEL:gpt-4o-mini}

# --- Mail (optional; disabled by default) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
app.mail.from=${MAIL_FROM:fixmate.noreply@gmail.com}
app.mail.enabled=${MAIL_ENABLED:false}
