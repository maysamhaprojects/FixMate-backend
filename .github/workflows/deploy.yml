name: Deploy to EC2

# רץ בכל דחיפה ל-main, וגם ניתן להריץ ידנית מלשונית Actions
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # המפתח נשמר כ-base64 בשורה אחת (EC2_SSH_KEY_B64) כדי להימנע מבעיות
      # שורות בהעתקה. מפענחים אותו למשתנה סביבה רב-שורתי ומעבירים ישירות.
      - name: Decode SSH key
        run: |
          {
            echo "SSH_KEY<<SSHKEY_EOF"
            echo "${{ secrets.EC2_SSH_KEY_B64 }}" | base64 -d
            echo "SSHKEY_EOF"
          } >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ env.SSH_KEY }}
          command_timeout: 30m
          script: bash ~/deploy.sh
